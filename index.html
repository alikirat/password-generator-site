<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css" />
  <title>Password Generator</title>
</head>
<body>
  <div class="container">

    <!-- Theme toggle -->
    <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
      <!-- Balanced sun icon -->
      <svg
        class="theme-icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="6" />
      </svg>
    </button>

    <h1>
      <span class="white">Generate a</span><br />
      <span class="green">random password</span>
    </h1>

    <p id="title-p">Never use an insecure password again.</p>

    <!-- Controls -->
    <div class="controls">
      <div class="control length-control">
        <label for="length-input">Length</label>
        <input id="length-input" type="range" min="4" max="32" value="15" />
        <span id="length-value">15</span>
      </div>

      <div class="control check">
        <input id="numbers-toggle" type="checkbox" checked />
        <label for="numbers-toggle">Numbers</label>
      </div>

      <div class="control check">
        <input id="symbols-toggle" type="checkbox" checked />
        <label for="symbols-toggle">Symbols</label>
      </div>
    </div>

    <button id="generate-password-btn" onclick="generateRandomPasswords()">
      Generate passwords
    </button>

    <hr id="line" />

    <div id="passwords">
      <button id="suggested-p-1" title="Click to copy"></button>
      <button id="suggested-p-2" title="Click to copy"></button>
    </div>

    <p id="copy-hint">Tip: click a password to copy.</p>
  </div>

  <script src="index.js"></script>
</body>
</html>
